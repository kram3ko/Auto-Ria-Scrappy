services:
  db:
    image: postgres:alpine
    container_name: autoria_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - autoria_db:/var/lib/postgresql/data/
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./dumps:/src/dumps

volumes:
  autoria_db: